name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: mypy orchestrator contracts worker cli

  tests:
    runs-on: ubuntu-latest
    needs: lint-and-types
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: orch, POSTGRES_PASSWORD: orch, POSTGRES_DB: orch_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orch" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://orch:orch@localhost:5432/orch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - name: Unit, integration, e2e and chaos tests (PostgreSQL + in-memory runtime)
        run: pytest -m "not docker" --maxfail=5 -q
      - name: DockerRuntime tests against the runner's real Docker daemon
        run: pytest -m docker -q

  build-and-scan:
    runs-on: ubuntu-latest
    needs: tests
    strategy:
      matrix: {target: [api, worker]}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: mini-k8s-${{ matrix.target }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mini-k8s-${{ matrix.target }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy dependency/config scan
        uses: aquasecurity/trivy-action@0.28.0
        with: {scan-type: fs, scan-ref: ., severity: HIGH,CRITICAL, ignore-unfixed: true, exit-code: "1"}

  compose-acceptance:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from the example with generated secrets
        run: |
          cp .env.example .env
          for v in POSTGRES_PASSWORD ADMIN_API_KEY OPERATOR_API_KEY READ_ONLY_API_KEY WORKER_API_KEY GRAFANA_ADMIN_PASSWORD; do
            sed -i "s|^$v=.*|$v=$(openssl rand -hex 16)|" .env
          done
          sed -i "s|^DATABASE_URL=.*|DATABASE_URL=postgresql+psycopg2://orchestrator:$(grep ^POSTGRES_PASSWORD .env | cut -d= -f2)@postgres:5432/orchestrator|" .env
          sed -i "s|^ORCHESTRATOR_API_KEY=.*|ORCHESTRATOR_API_KEY=$(grep ^ADMIN_API_KEY .env | cut -d= -f2)|" .env
      - run: docker compose up --build -d
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e .
      - name: Full acceptance scenario (deploy, scale, kill container, stop worker)
        run: set -a && . ./.env && set +a && ./scripts/demo.sh --ci
      - if: failure()
        run: docker compose logs --no-color | tail -300
      - if: always()
        run: docker compose down -v

  publish:
    runs-on: ubuntu-latest
    needs: [build-and-scan, compose-acceptance]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions: {contents: read, packages: write}
    strategy:
      matrix: {target: [api, worker]}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mini-k8s-orchestrator-${{ matrix.target }}:latest
            ghcr.io/${{ github.repository_owner }}/mini-k8s-orchestrator-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha
