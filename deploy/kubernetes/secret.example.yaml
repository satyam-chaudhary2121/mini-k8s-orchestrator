# TEMPLATE ONLY. Create the real secret out-of-band, e.g.:
#   kubectl -n orchestrator create secret generic orchestrator-secrets \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 16)" \
#     --from-literal=ADMIN_API_KEY="$(openssl rand -hex 24)" \
#     --from-literal=OPERATOR_API_KEY="$(openssl rand -hex 24)" \
#     --from-literal=READ_ONLY_API_KEY="$(openssl rand -hex 24)" \
#     --from-literal=WORKER_API_KEY="$(openssl rand -hex 24)"
# DATABASE_URL is assembled from POSTGRES_PASSWORD in api-server.yaml.
apiVersion: v1
kind: Secret
metadata: {name: orchestrator-secrets, namespace: orchestrator}
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE_ME
  ADMIN_API_KEY: CHANGE_ME
  OPERATOR_API_KEY: CHANGE_ME
  READ_ONLY_API_KEY: CHANGE_ME
  WORKER_API_KEY: CHANGE_ME
